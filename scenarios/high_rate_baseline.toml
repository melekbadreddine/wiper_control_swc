name = "high_rate_baseline"
description = "Ignition on, stalk HIGH from power-on: baseline sweep rate and clean diagnostics (REQ-WIP-004)."
duration_ms = 15000

[setup]
  ignition = "on"
  [setup.stalk]
  mode = "high"

[[checks]]
  kind = "wipe_rate"
  min = 60.0
  max = 73.0

[[checks]]
  kind = "no_active_dtcs"
