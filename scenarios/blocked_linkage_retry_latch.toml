name = "blocked_linkage_retry_latch"
description = "LOW wiping; linkage blocked at 1 s: stall detection, retries after cooldowns, latch, latch cleared only by an ignition cycle (REQ-WIP-012)."
duration_ms = 16000

[setup]
  ignition = "on"
  [setup.stalk]
  mode = "low"

[[events]]
  at_ms = 1000
  fault = "blocked_linkage"

[[events]]
  at_ms = 9000
  fault = "unblock_linkage"

[[events]]
  at_ms = 10000
  ignition = "off"

[[events]]
  at_ms = 10500
  ignition = "on"

[[checks]]
  kind = "dtc"
  dtc = "motor_stall"
  active = false
  latched = true

[[checks]]
  kind = "wipe_count"
  min = 3
