name = "low_rate_baseline"
description = "Ignition on, stalk LOW from power-on: baseline sweep rate and clean diagnostics (REQ-WIP-003, REQ-WIP-019)."
duration_ms = 15000

[setup]
  ignition = "on"
  [setup.stalk]
  mode = "low"

[[checks]]
  kind = "wipe_rate"
  min = 40.0
  max = 50.0

[[checks]]
  kind = "no_active_dtcs"

[[checks]]
  kind = "wipe_count"
  min = 6
