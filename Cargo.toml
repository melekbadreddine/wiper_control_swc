[workspace]
resolver = "2"
members = [
    "crates/autosar-rte",
    "crates/wiper-swc",
    "crates/bsw-sim",
    "crates/plant-sim",
    "crates/scenario-runner",
    "crates/ros2-nodes",
    "crates/arxml-gen",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/melek/wiper_control_swc"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
missing_panics_doc = "allow"        # panics are denied anyway; keep noise out of `no_std` helpers
module_name_repetitions = "allow"   # AUTOSAR-style long type names make this unavoidable
needless_raw_string_hashes = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
