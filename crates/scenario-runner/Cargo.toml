[package]
name = "scenario-runner"
description = "Headless closed-loop scenario runner: loads TOML scenarios, runs ECU + plant in virtual time, logs CSV/MCAP, evaluates pass/fail"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "scenario-runner"
path = "src/main.rs"

[dependencies]
bsw-sim = { path = "../bsw-sim" }
mcap = { version = "0.26.0", default-features = false }
plant-sim = { path = "../plant-sim" }
serde = { version = "1", features = ["derive"] }
toml = "1"
wiper-swc = { path = "../wiper-swc" }

[lints]
workspace = true
