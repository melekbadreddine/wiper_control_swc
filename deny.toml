# cargo-deny configuration. `make ci` runs `cargo deny check bans licenses sources`.
# Advisories (`cargo deny check advisories`) require the advisory DB; run with network.
[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "ISC", "CDLA-Permissive-2.0", "CC0-1.0", "OpenSSL", "BSD-2-Clause"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
